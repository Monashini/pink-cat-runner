<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mona Game</title>
    <!-- Google Fonts: Fredoka One for cute style -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
    <!-- Linking external CSS file for styling -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Main Game Container -->
    <div id="game-container" class="center-screen">

        <!-- Score Display Section -->
        <div id="score-board">
            <span id="score">Score: 00000</span>
            <span id="high-score">HI: 00000</span>
        </div>

        <!-- Canvas for Gameplay Rendering -->
        <canvas id="game-canvas" width="800" height="200"></canvas>

        <!-- Start Screen Overlay -->
        <div id="start-screen" class="overlay">
            <h1>Mona Game</h1>
            <p>Press Space to Start</p>
        </div>

        <!-- Game Over Screen Overlay (Hidden by default) -->
        <div id="game-over-screen" class="overlay hidden">
            <h1>Game Over</h1>
            <p>Press Space to Restart</p>
        </div>

    </div>

    <!-- Linking external JavaScript file for game logic -->
    <script src="script.js"></script>

</body>

</html>
